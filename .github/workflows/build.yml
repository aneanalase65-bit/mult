name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau proyek diunggah sebagai satu file .zip, ekstrak dulu.
      - name: Ekstrak zip jika ada
        run: |
          if [ ! -d app ] && ls ./*.zip >/dev/null 2>&1; then
            unzip -q -o ./*.zip -d _unz
            cp -r _unz/*/. .
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Pasang CMake untuk build native
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1"

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DbxComp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
